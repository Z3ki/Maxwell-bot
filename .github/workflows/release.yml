name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths: ['VERSION', '.github/workflows/release.yml']

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.guard.outputs.publish }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        id: version
        shell: bash
        run: |
          version="$(cat VERSION)"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          if [[ "$GITHUB_REF_TYPE" = tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          else
            test "$GITHUB_REF_NAME" = main
          fi
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          echo "release_tag=v$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:v$version" >> "$GITHUB_OUTPUT"
      - name: Check release tag before publication
        id: guard
        shell: bash
        run: |
          status=0
          refs="$(git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")" || status=$?
          case "$status" in
            0)
              existing="$(printf '%s\n' "$refs" | awk 'NR == 1 {sha = $1} $2 ~ /\^\{\}$/ {sha = $1} END {print sha}')"
              if [[ "$existing" != "$GITHUB_SHA" ]]; then
                echo "Skipping $RELEASE_TAG: it already belongs to commit $existing."
                echo "publish=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
            2) ;; # No matching tag: first publication of this version.
            *) exit "$status" ;; # An unavailable remote is not a missing tag.
          esac
          echo "publish=true" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      IMAGE: ${{ needs.prepare.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install repository inspection dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git ripgrep
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pip check
      - run: ruff check .
      - run: python scripts/check_shell_syntax.py
      - run: python -m pytest -W error::RuntimeWarning --cov --cov-report=term-missing:skip-covered
      - name: Build runtime image
        run: docker build -f docker/maxwell.Dockerfile --build-arg MAXWELL_BUILD_COMMIT="$GITHUB_SHA" -t "$IMAGE" .
      - name: Exercise release image entrypoint
        run: |
          docker run --rm --network none "$IMAGE" python3 -c 'from config import Config; from docker.supervisor import supervise; from providers import OllamaProvider; print("Release image imports and entrypoint OK")'
          docker run --rm --network none "$IMAGE" python3 -m pip check
      - name: Prepare downloadable source and installers
        shell: bash
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="maxwell-$RELEASE_TAG/" -o "dist/maxwell-$RELEASE_TAG.tar.gz" HEAD
          cp easy-install.sh install.sh VERSION dist/
          python scripts/release_notes.py > dist/RELEASE_NOTES.md
          (cd dist && sha256sum *.sh VERSION *.tar.gz > SHA256SUMS)
      - name: Publish versioned container image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" > dist/CONTAINER_IMAGE
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            existing="$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$RELEASE_TAG" --jq .sha)"
            test "$existing" = "$GITHUB_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" --title "Maxwell $RELEASE_TAG" --notes-file dist/RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Maxwell $RELEASE_TAG" --notes-file dist/RELEASE_NOTES.md
          fi
