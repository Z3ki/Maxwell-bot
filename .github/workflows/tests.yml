name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Shared-core gate (maxwell_core, message_pipeline, concurrency_safety). The
  # repository-wide gate is fail_under in pyproject.toml.
  CORE_COVERAGE_FAIL_UNDER: "86"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check --output-format=github .
      # The legacy tree is not ruff-formatted yet (300+ files would change).
      # New test modules live under tests/unit and must stay formatted.
      - name: Ruff format (new test modules)
        run: ruff format --check --diff tests/unit
      - run: python scripts/check_shell_syntax.py

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      # Scope and per-module baseline live in [tool.mypy] in pyproject.toml.
      - name: mypy (gated modules)
        run: mypy

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Known-vulnerable dependencies (pip-audit)
        run: pip-audit --progress-spinner off -r requirements.txt -r requirements-dev.txt
      # Medium+ severity and confidence. Findings that predate this gate are
      # recorded in .bandit-baseline.json; anything new fails the job.
      - name: Static security scan (bandit, new findings only)
        run: >-
          bandit -q -r . -ll -ii
          -x ./tests,./.venv,./venv,./data,./temp,./shelldocker
          -b .bandit-baseline.json

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install repository inspection dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git ripgrep ffmpeg
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pip check
      - name: Regression tests and repository branch coverage
        run: python -u -m pytest -v -W error::RuntimeWarning --cov --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Shared-core coverage gate
        run: >-
          python -m coverage report --skip-covered
          --include='maxwell_core/*,message_pipeline.py,concurrency_safety.py'
          --fail-under="$CORE_COVERAGE_FAIL_UNDER"
      - name: Upload coverage report
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
      - name: Benchmark scoped conversation history
        if: matrix.python-version == '3.12'
        run: python scripts/benchmark_conversation_history.py --guilds 100 500 1000 --iterations 10
      - name: Benchmark uncapped inbound admission
        if: matrix.python-version == '3.12'
        run: python scripts/benchmark_inbound_queue.py --servers 100 500 1000 --iterations 10 --max-outstanding 0

  music-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LAVALINK_PASSWORD: ci-only-music-node-secret
      # Compose requires this for the cipher sidecar. The version check does not start it.
      YOUTUBE_CIPHER_PASSWORD: ci-only-cipher-secret
    steps:
      - uses: actions/checkout@v7
      - name: Prepare deployment environment
        run: cp .env.simple.example .env
      - name: Validate host and bridge music deployment configuration
        run: |
          docker compose -f docker-compose.yml -f docker-compose.music.yml config --quiet
          LAVALINK_HOST=lavalink docker compose -f docker-compose.bridge.yml -f docker-compose.music.yml config --quiet
      - name: Build and start pinned audio image; require authenticated node health
        run: docker compose -f docker-compose.yml -f docker-compose.music.yml up -d --build --wait --wait-timeout 180 lavalink
      - name: Verify audio JVM container resource detection
        run: docker compose -f docker-compose.yml -f docker-compose.music.yml exec -T lavalink java -XshowSettings:system -version
      - name: Verify pinned server and YouTube plugin versions
        run: |
          docker compose -f docker-compose.yml -f docker-compose.music.yml exec -T lavalink sh -c 'curl -fsS -H "Authorization: $LAVALINK_PASSWORD" http://127.0.0.1:2333/v4/info' > /tmp/music-info.json
          python - <<'PYCODE'
          import json
          info = json.load(open('/tmp/music-info.json'))
          assert info['version']['semver'] == '4.2.2', info
          assert any(p['name'].lower() == 'youtube-plugin' and p['version'] == '2be8e542d3f6f178e048dca565892684c2e40177' for p in info['plugins']), info
          print('Pinned DAVE audio node and YouTube plugin snapshot are healthy')
          PYCODE
      - name: Audio node diagnostics
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.music.yml logs --tail=100 lavalink
      - name: Stop audio node
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.music.yml down --remove-orphans
