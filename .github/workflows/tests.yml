name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pip check
      - run: ruff check .
      - run: bash -n install.sh setup.sh docker/entrypoint.sh
      - run: python -m pytest
      - name: Benchmark scoped memory retrieval
        if: matrix.python-version == '3.12'
        run: python scripts/benchmark_memory_scaling.py --guilds 100 500 1000 --facts-per-guild 5 --iterations 10
      - name: Benchmark bounded inbound admission
        if: matrix.python-version == '3.12'
        run: python scripts/benchmark_inbound_queue.py --servers 100 500 1000 --iterations 10 --max-outstanding 256
