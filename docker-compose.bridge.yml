# Used when host networking is not available (Docker Desktop on macOS/Windows).
# Local LLM URLs in .env should use host.docker.internal instead of localhost
# (install.sh rewrites them). Site-backend loopback ports are not published
# here; prefer Linux + docker-compose.yml for that.
services:
  maxwell:
    build:
      context: .
      dockerfile: docker/maxwell.Dockerfile
    image: maxwell:local
    container_name: maxwell
    restart: unless-stopped
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 4g
    memswap_limit: 4g
    cpus: "2.0"
    pids_limit: 2048
    shm_size: 256mb
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      MAXWELL_IN_DOCKER: "1"
      MAXWELL_HOST_BIND: ${MAXWELL_HOST_BIND:-}
      MAXWELL_APP_ROOT: /app
      MAXWELL_API_HOST: 0.0.0.0
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Same host path Caddy serves. See docker-compose.yml.
      - ${MAXWELL_SITE_DIR:-./public/bot}:${MAXWELL_SITE_DIR:-/app/public/bot}
    ports:
      - "127.0.0.1:${MAXWELL_API_PORT:-8765}:${MAXWELL_API_PORT:-8765}"
    stop_grace_period: 20s
