# Linux default. Host networking keeps localhost Ollama, site backends on
# 127.0.0.1:8800-8899, Discord voice UDP, and the dashboard on :8765 working
# without port-map gymnastics. Python and system packages stay inside the
# image so they cannot fight the host.
#
# macOS/Windows: install.sh uses docker-compose.bridge.yml instead.
services:
  maxwell:
    build:
      context: .
      dockerfile: docker/maxwell.Dockerfile
    image: maxwell:local
    container_name: maxwell
    restart: unless-stopped
    init: true
    network_mode: host
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 4g
    memswap_limit: 4g
    cpus: "2.0"
    pids_limit: 2048
    shm_size: 256mb
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      MAXWELL_IN_DOCKER: "1"
      MAXWELL_HOST_BIND: ${MAXWELL_HOST_BIND:-}
      MAXWELL_APP_ROOT: /app
    volumes:
      - .:/app
      # :ro still allows the Docker API (unix sockets ignore the ro bit for
      # I/O) but blocks replacing the socket inode from inside the container.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Caddy serves generated sites from MAXWELL_SITE_DIR on the *host*.
      # Without this mount, create_site writes into the container overlay and
      # the public URL 404s. Empty SITE_DIR falls back to public/bot under /app
      # (already covered by .:/app; the extra bind is then a no-op duplicate).
      - ${MAXWELL_SITE_DIR:-./public/bot}:${MAXWELL_SITE_DIR:-/app/public/bot}
    stop_grace_period: 20s
