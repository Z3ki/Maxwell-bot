server:
  port: 2333
  address: 0.0.0.0
lavalink:
  plugins:
    - dependency: dev.lavalink.youtube:youtube-plugin:1.18.2
      snapshot: false
  server:
    password: ${LAVALINK_PASSWORD}
    sources:
      youtube: false
      bandcamp: false
      soundcloud: false
      twitch: false
      vimeo: false
      nico: false
      http: false
      local: false
    opusEncodingQuality: 5
    resamplingQuality: MEDIUM
    youtubePlaylistLoadLimit: 1
    playerUpdateInterval: 5
    trackStuckThresholdMs: 10000
plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
logging:
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: false
