server:
  port: 2333
  address: 0.0.0.0
lavalink:
  plugins:
    # 1.18.2 fails this host with "requires login" and a broken WEB signature
    # extractor. This snapshot restores iOS playback and the cipher fetch.
    - dependency: dev.lavalink.youtube:youtube-plugin:2be8e542d3f6f178e048dca565892684c2e40177
      snapshot: true
  server:
    password: ${LAVALINK_PASSWORD}
    sources:
      youtube: false
      bandcamp: false
      soundcloud: false
      twitch: false
      vimeo: false
      nico: false
      http: false
      local: false
    opusEncodingQuality: 5
    resamplingQuality: MEDIUM
    youtubePlaylistLoadLimit: 1
    playerUpdateInterval: 5
    trackStuckThresholdMs: 10000
plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - IOS
      - TV
      - ANDROID_VR
      - WEB
      - TVHTML5_SIMPLY
      - MUSIC
    # TV playback needs a signed-in account. Leave the refresh token blank to
    # print a one-time device code. Store the resulting token only in .env.
    oauth:
      enabled: true
      refreshToken: ${YOUTUBE_OAUTH_REFRESH_TOKEN:}
logging:
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: false
