<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maxwell Admin</title>
    <style>
      :root {
        --bg: #0a0a0c;
        --nav: #0a0a0c;
        --panel: #0f0f12;
        --panel2: #14141a;
        --line: #1c1c22;
        --line2: #2a2a32;
        --text: #e4e4e8;
        --muted: #8a8a96;
        --dim: #4a4a56;
        --green: #7dd87f;
        --yellow: #d8c873;
        --red: #e57585;
        --mono:
          "SF Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --font:
          Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        font-size: 14px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      a {
        color: var(--text);
        text-decoration: none;
      }
      a:hover {
        color: var(--muted);
      }
      .hidden {
        display: none !important;
      }
      .login-wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .login {
        width: min(380px, 100%);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 24px;
      }
      .login h1 {
        font-size: 20px;
        margin: 0 0 6px;
        font-weight: 600;
      }
      .login p {
        margin: 0 0 18px;
        color: var(--muted);
      }
      .err {
        min-height: 20px;
        color: var(--red);
        font-size: 13px;
      }
      .app {
        display: none;
        min-height: 100vh;
      }
      .app.authed {
        display: grid;
        grid-template-columns: 220px 1fr;
      }
      .side {
        background: var(--bg);
        border-right: 1px solid var(--line);
        padding: 18px;
        position: sticky;
        top: 0;
        height: 100vh;
      }
      .brand {
        font-weight: 600;
        font-size: 16px;
        margin-bottom: 2px;
        letter-spacing: -0.02em;
      }
      .sub {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 20px;
      }
      .navbtn {
        display: block;
        width: 100%;
        text-align: left;
        border: none;
        background: transparent;
        color: var(--muted);
        padding: 8px 10px;
        border-radius: 6px;
        margin: 2px 0;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .navbtn:hover {
        color: var(--text);
      }
      .navbtn.active {
        background: var(--panel2);
        color: var(--text);
      }
      .side-bottom {
        position: absolute;
        left: 18px;
        right: 18px;
        bottom: 18px;
        display: grid;
        gap: 8px;
      }
      .main {
        min-width: 0;
      }
      .top {
        height: 56px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        background: var(--bg);
        position: sticky;
        top: 0;
        z-index: 3;
      }
      .top h2 {
        font-size: 15px;
        margin: 0;
        font-weight: 600;
      }
      .top-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .content {
        padding: 20px;
        max-width: 1420px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }
      .grid.two {
        grid-template-columns: repeat(2, 1fr);
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
      }
      .card h3 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
        margin: 0 0 14px;
        font-weight: 600;
      }
      .metric {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
      }
      .metric b {
        display: block;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .metric span {
        color: var(--muted);
        font-size: 12px;
      }
      .panel {
        display: none;
      }
      .panel.active {
        display: block;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .stack {
        display: grid;
        gap: 8px;
      }
      .field {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 8px;
        padding: 9px 10px;
        outline: none;
        transition: border-color 0.15s;
      }
      .field:focus {
        border-color: var(--line2);
      }
      textarea.field {
        min-height: 110px;
        resize: vertical;
      }
      .btn {
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--text);
        border-radius: 8px;
        padding: 8px 12px;
        transition: border-color 0.15s;
      }
      .btn:hover {
        border-color: var(--line2);
      }
      .btn.primary {
        background: var(--text);
        color: var(--bg);
        border-color: var(--text);
      }
      .btn.primary:hover {
        background: #fff;
        border-color: #fff;
      }
      .btn.red {
        color: var(--red);
        border-color: var(--line);
      }
      .btn.red:hover {
        border-color: var(--red);
      }
      .btn.green {
        color: var(--green);
        border-color: var(--line);
      }
      .btn.green:hover {
        border-color: var(--green);
      }
      .btn.small {
        padding: 6px 10px;
        font-size: 13px;
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 4px;
        border: 1px solid var(--line);
        color: var(--muted);
        font-weight: 500;
      }
      .badge.ok {
        color: var(--green);
        border-color: rgba(125, 216, 127, 0.25);
      }
      .badge.bad {
        color: var(--red);
        border-color: rgba(229, 117, 133, 0.25);
      }
      .badge.warn {
        color: var(--yellow);
        border-color: rgba(216, 200, 115, 0.25);
      }
      .mono {
        font-family: var(--mono);
      }
      .muted {
        color: var(--muted);
      }
      .switchline {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--line);
        padding: 10px 0;
      }
      .switchline:last-child {
        border-bottom: 0;
      }
      .switch {
        position: relative;
        width: 42px;
        height: 24px;
        flex: 0 0 auto;
      }
      .switch input {
        opacity: 0;
      }
      .knob {
        position: absolute;
        inset: 0;
        background: #26262e;
        border-radius: 999px;
      }
      .knob:before {
        content: "";
        position: absolute;
        width: 18px;
        height: 18px;
        top: 3px;
        left: 3px;
        background: #7a7a86;
        border-radius: 50%;
        transition: 0.14s;
      }
      input:checked + .knob {
        background: rgba(125, 216, 127, 0.25);
      }
      input:checked + .knob:before {
        transform: translateX(18px);
        background: var(--green);
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 9px;
        text-align: left;
        vertical-align: top;
      }
      th {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 600;
      }
      .table {
        overflow: auto;
      }
      .list {
        display: grid;
        gap: 8px;
      }
      .item {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
      }
      pre {
        margin: 0;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        white-space: pre-wrap;
        max-height: 420px;
        overflow: auto;
        font-size: 12px;
        line-height: 1.6;
        font-family: var(--mono);
        color: var(--muted);
      }
      .toast {
        position: fixed;
        right: 18px;
        bottom: 18px;
        background: var(--text);
        color: var(--bg);
        border-radius: 8px;
        padding: 10px 14px;
        font-weight: 600;
        opacity: 0;
        pointer-events: none;
        transition: 0.16s;
      }
      .toast.show {
        opacity: 1;
      }
      @media (max-width: 980px) {
        .app.authed {
          display: block;
        }
        .side {
          position: sticky;
          top: 0;
          height: auto;
          z-index: 5;
          padding: 12px;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .sub {
          margin-bottom: 10px;
        }
        #nav {
          display: flex;
          gap: 6px;
          overflow-x: auto;
          padding: 4px 0 8px;
          scrollbar-width: thin;
          -webkit-overflow-scrolling: touch;
        }
        .navbtn {
          flex: 0 0 auto;
          width: auto;
          white-space: nowrap;
          margin: 0;
          padding: 8px 10px;
        }
        .navbtn.active {
          background: var(--panel2);
        }
        .side-bottom {
          position: static;
          margin-top: 8px;
          display: flex;
        }
        .side-bottom .btn {
          flex: 1;
          text-align: center;
        }
        .main {
          min-width: 0;
        }
        .top {
          position: sticky;
          top: 96px;
          height: auto;
          min-height: 52px;
          align-items: flex-start;
          gap: 8px;
          padding: 10px 12px;
        }
        .top-actions {
          flex-wrap: wrap;
          justify-content: flex-end;
        }
        .content {
          padding: 14px;
          max-width: none;
        }
        .grid,
        .grid.two {
          grid-template-columns: 1fr;
        }
        .metric {
          padding: 14px;
        }
        .metric b {
          font-size: 21px;
        }
        .card {
          padding: 14px;
        }
        .row {
          align-items: stretch;
        }
        .row > .field {
          max-width: none !important;
        }
        .btn {
          min-height: 40px;
        }
        .btn.small {
          min-height: 34px;
        }
        .switchline {
          gap: 14px;
        }
        .table {
          overflow-x: auto;
          -webkit-overflow-scrolling: touch;
        }
        table {
          min-width: 680px;
        }
        pre {
          max-height: 55vh;
        }
        .toast {
          left: 12px;
          right: 12px;
          bottom: 12px;
          text-align: center;
        }
        .login-wrap {
          padding: 16px;
        }
      }
      @media (max-width: 520px) {
        html,
        body {
          font-size: 13px;
        }
        .brand {
          font-size: 15px;
        }
        .top {
          top: 92px;
        }
        .top h2 {
          width: 100%;
          font-size: 14px;
        }
        .top-actions {
          width: 100%;
          justify-content: space-between;
        }
        .top-actions .badge {
          flex: 1;
          text-align: center;
        }
        .content {
          padding: 10px;
        }
        .card,
        .metric,
        .item {
          border-radius: 8px;
        }
        .login {
          padding: 18px;
        }
        .field,
        textarea.field {
          font-size: 16px;
        }
        .row {
          display: grid;
          grid-template-columns: 1fr;
        }
        .row .btn,
        .stack .btn {
          width: 100%;
        }
        .side-bottom {
          display: grid;
          grid-template-columns: 1fr 1fr;
        }
        .switch {
          width: 46px;
        }
        .knob:before {
          width: 20px;
          height: 20px;
          top: 2px;
          left: 2px;
        }
        input:checked + .knob:before {
          transform: translateX(22px);
        }
      }
    </style>
  </head>
  <body>
    <div id="login" class="login-wrap">
      <form id="loginForm" class="login">
        <h1>Maxwell Admin</h1>
        <p>Sign in to open the command center.</p>
        <div class="stack">
          <input
            id="user"
            class="field"
            autocomplete="username"
            placeholder="Username"
          /><input
            id="pass"
            class="field"
            type="password"
            autocomplete="current-password"
            placeholder="Password"
          />
          <div id="error" class="err"></div>
          <button class="btn primary" type="submit">Login</button
          ><button id="clear" class="btn" type="button">
            Clear saved login
          </button>
          <div
            style="
              margin: 14px 0 8px;
              text-align: center;
              color: var(--muted);
              font-size: 12px;
            "
          >
            — or —
          </div>
          <button
            id="discordLogin"
            class="btn primary"
            type="button"
            style="
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 10px;
              width: 100%;
            "
          >
            Continue with Discord
          </button>
        </div>
      </form>
    </div>
    <div id="app" class="app">
      <aside class="side">
        <div class="brand">maxwell</div>
        <div class="sub">command center</div>
        <nav id="nav"></nav>
        <div class="side-bottom">
          <a class="btn small" href="/">Main page</a
          ><button id="logout" class="btn small red">Logout</button>
        </div>
      </aside>
      <main class="main">
        <header class="top">
          <h2 id="title">Overview</h2>
          <div class="top-actions">
            <span id="autoState" class="badge">manual refresh</span
            ><span id="apiState" class="badge">API</span
            ><button id="refresh" class="btn small primary">Refresh</button>
          </div>
        </header>
        <div class="content">
          <section class="grid" id="metrics"></section>
          <section id="overview" class="panel"></section>
          <section id="commands" class="panel"></section>
          <section id="discord" class="panel"></section>
          <section id="inbox" class="panel"></section>
          <section id="llm" class="panel"></section>
          <section id="rem" class="panel"></section>
          <section id="autonomy" class="panel"></section>
          <section id="controls" class="panel"></section>
          <section id="memory" class="panel"></section>
          <section id="context" class="panel"></section>
          <section id="logs" class="panel"></section>
          <section id="raw" class="panel"></section>
        </div>
      </main>
    </div>
    <div id="toast" class="toast"></div>
    <script>
      const S = {
        auth: null,
        discordToken: null,
        tab: "overview",
        status: null,
        system: null,
        control: {},
        tools: [],
        // Two different endpoints: the LTM rows the table renders, and the
        // aggregate vector counters the summary card renders. Keeping them in
        // one field is what made the Memory table come up empty.
        memoryEntries: [],
        memoryStats: {},
        entities: [],
        subagents: [],
        context: [],
        sites: {},
        prompts: {},
        blacklist: [],
        auto: [],
        commands: [],
        channels: [],
        discord: { guilds: [], dms: [] },
        rem: null,
        remRuns: [],
        autonomyStatus: null,
        autonomyLog: [],
        autonomyGoals: [],
        pm2: [],
        inbox: [],
        traces: [],
        logs: "",
        timer: null,
        pollTimer: null,
        loading: false,
        lastLoad: 0,
        filter: "",
        toolFilter: "",
        failedFeeds: [],
      };
      const T = [
        ["overview", "Overview"],
        ["commands", "Commands"],
        ["discord", "Discord"],
        ["inbox", "Inbox"],
        ["llm", "LLM"],
        ["rem", "REM"],
        ["autonomy", "Autonomy"],
        ["controls", "Controls"],
        ["memory", "Memory"],
        ["context", "Context"],
        ["logs", "Logs"],
        ["raw", "Raw"],
      ];
      const $ = (id) => document.getElementById(id);
      const esc = (v) =>
        String(v ?? "").replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const sid = (id, len = 16) => String(id ?? "").slice(0, len);
      const debounce = (fn, ms = 300) => {
        let t;
        return (...a) => {
          clearTimeout(t);
          t = setTimeout(() => fn(...a), ms);
        };
      };
      function toast(t) {
        const e = $("toast");
        e.textContent = t;
        e.classList.add("show");
        setTimeout(() => e.classList.remove("show"), 1800);
      }
      function auth() {
        return S.auth
          ? { Authorization: "Basic " + btoa(S.auth.user + ":" + S.auth.pass) }
          : S.discordToken
            ? { "X-Discord-Token": S.discordToken }
            : {};
      }
      async function api(url, opt = {}) {
        const r = await fetch(url, {
          ...opt,
          headers: { ...(opt.headers || {}), ...auth() },
        });
        let d = {};
        try {
          d = await r.json();
        } catch (e) {}
        if (r.status === 401) {
          logout(false);
          throw new Error("Unauthorized");
        }
        if (!r.ok) throw new Error(d.error || "HTTP " + r.status);
        return d;
      }
      async function login(user, pass) {
        const r = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user, pass }),
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok || !d.ok) throw new Error(d.error || "Login failed");
        S.auth = { user, pass };
        localStorage.setItem("mw_basic", btoa(user + ":" + pass));
        $("login").classList.add("hidden");
        $("app").classList.add("authed");
        await loadAll();
        startPolling();
      }
      async function loginDiscord() {
        const r = await fetch("/api/auth/discord/state");
        const d = await r.json().catch(() => ({}));
        if (!r.ok || !d.authorize_url)
          throw new Error(d.error || "Discord login not configured");
        const u = d.authorize_url;
        if (
          !/^https:\/\/(discord\.com|(([a-z0-9-]+\.)?discordapp\.com))\//i.test(
            u,
          )
        )
          throw new Error("Refusing redirect to unexpected authorize URL");
        window.location = u;
      }
      async function loginDiscordToken(token) {
        S.discordToken = token;
        localStorage.setItem("mw_discord_token", token);
        try {
          const v = await api("/api/auth/discord/verify");
          if (!v.ok) throw new Error("invalid token");
          S.discordUser = v;
          $("login").classList.add("hidden");
          $("app").classList.add("authed");
          await loadAll();
          startPolling();
        } catch (e) {
          S.discordToken = null;
          localStorage.removeItem("mw_discord_token");
          throw e;
        }
      }
      function logout(clear = true) {
        // Capture the token BEFORE clearing state so the server-side revoke
        // actually sends it (otherwise it always fires without the header).
        const revokeToken = S.discordToken;
        S.auth = null;
        S.discordToken = null;
        S.discordUser = null;
        $("app").classList.remove("authed");
        $("login").classList.remove("hidden");
        if (clear) {
          localStorage.removeItem("mw_basic");
          localStorage.removeItem("mw_discord_token");
          try {
            fetch("/api/auth/discord/logout", {
              method: "POST",
              headers: revokeToken ? { "X-Discord-Token": revokeToken } : {},
            });
          } catch (e) {}
        }
      }
      function startPolling() {
        if (S.pollTimer) clearInterval(S.pollTimer);
        S.pollTimer = setInterval(() => loadAll(true), 15000);
      }
      function badge(v, k = "") {
        return `<span class="badge ${k}">${esc(v)}</span>`;
      }
      function bytes(n) {
        n = Number(n || 0);
        if (n < 1024) return n + "B";
        if (n < 1048576) return (n / 1024).toFixed(1) + "K";
        if (n < 1073741824) return (n / 1048576).toFixed(1) + "M";
        return (n / 1073741824).toFixed(1) + "G";
      }
      function up(ms) {
        if (!ms) return "-";
        const s = Math.max(0, Math.floor((Date.now() - Number(ms)) / 1000));
        return Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m";
      }
      // Every panel's data source, loaded independently of the others.
      // `norm` shapes the raw response into what the render functions expect;
      // `required` marks the feeds without which there is nothing to draw at
      // all. Anything else that errors keeps its previous value and is
      // reported in the header, instead of one bad endpoint blanking the
      // whole dashboard the way Promise.all used to.
      const FEEDS = [
        { key: "status", url: "/api/status", required: true, norm: (d) => d || {} },
        { key: "system", url: "/api/system", norm: (d) => d || {} },
        {
          // Sanitized + defaults-merged, unlike /data/bot_control.json which
          // only holds keys someone has actually written. Falls back to the
          // raw file if an older API build has no GET /api/control.
          key: "control",
          url: "/api/control",
          required: true,
          fallbackUrl: "/data/bot_control.json",
          norm: (d) => {
            if (!d || typeof d !== "object" || Array.isArray(d)) return {};
            if (d.control && typeof d.control === "object") return d.control;
            return d;
          },
        },
        {
          // The memory table's rows. /api/rag/memory is stats only — reading
          // the table off it is what produced an empty Memory panel.
          key: "memoryEntries",
          url: "/api/rag/ltm",
          norm: (d) =>
            Array.isArray(d) ? d : Array.isArray(d?.entries) ? d.entries : [],
        },
        {
          // Aggregate vector counters for the summary card only.
          key: "memoryStats",
          url: "/api/rag/memory",
          norm: (d) => (d && typeof d === "object" && !Array.isArray(d) ? d : {}),
        },
        {
          // Global per-user entity memory — one row per Discord user id,
          // independent of guild. Optional: a database from before the
          // feature has no table and the endpoint answers with an empty set.

      async function loadFeed(feed) {
        try {
          return await api(feed.url);
        } catch (e) {
          if (!feed.fallbackUrl || String(e.message) === "Unauthorized") throw e;
          return await api(feed.fallbackUrl);
        }
      }
      async function loadAll(silent = false) {
        if (S.loading) return;
        S.loading = true;
        if (!silent) {
          $("apiState").textContent = "loading";
          $("apiState").className = "badge warn";
        }
        try {
          const results = await Promise.allSettled(FEEDS.map(loadFeed));
          const failed = [];
          let fatal = null;
          results.forEach((r, i) => {
            const feed = FEEDS[i];
            if (r.status === "fulfilled") {
              S[feed.key] = feed.norm(r.value);
              return;
            }
            // api() already logged us out on a 401; surface it and stop.
            if (String(r.reason?.message) === "Unauthorized") {
              fatal = fatal || r.reason;
              return;
            }
            failed.push(feed.key);
            if (feed.required) fatal = fatal || r.reason;
          });
          if (fatal) throw fatal;
          S.tools = (S.status && S.status.known_tools) || S.tools || [];
          S.failedFeeds = failed;
          S.lastLoad = Date.now();
          const online = !!(S.status && S.status.online);
          $("apiState").textContent =
            (online ? "online" : "offline") +
            (failed.length ? " · " + failed.length + " degraded" : "");
          $("apiState").className =
            "badge " + (failed.length ? "warn" : online ? "ok" : "bad");
          $("apiState").title = failed.length
            ? "Failed to load: " + failed.join(", ")
            : "";
          if (failed.length && !silent)
            toast("Partial load — unavailable: " + failed.join(", "));
          render();
        } catch (e) {
          $("apiState").textContent = "error";
          $("apiState").className = "badge bad";
          toast(e.message);
        } finally {
          S.loading = false;
        }
      }

      function collectControls(root) {

          out[k] = raw;

      };
      (async function () {
        const m = location.hash.match(/discord_token=([^&]+)/);
        if (m) {
          history.replaceState(null, "", location.pathname + location.search);
          try {
            await loginDiscordToken(m[1]);
          } catch (err) {
            $("error").textContent = err.message;
          }
          return;
        }
        try {
          const t = localStorage.getItem("mw_discord_token");
          if (t) {
            await loginDiscordToken(t);
          } else {
            const b = localStorage.getItem("mw_basic");
            if (b) {
              const decoded = atob(b);
              const i = decoded.indexOf(":");
              const u = i >= 0 ? decoded.slice(0, i) : decoded;
              const p = i >= 0 ? decoded.slice(i + 1) : "";
              await login(u, p);
            }
          }
        } catch (e) {
          logout(false);
        }
      })();
    </script>
  </body>
</html>
