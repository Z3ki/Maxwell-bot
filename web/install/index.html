<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add Maxwell</title>
    <style>
      :root {
        --bg: #0a0a0c;
        --panel: #0f0f12;
        --line: #1c1c22;
        --text: #e4e4e8;
        --muted: #8a8a96;
        --red: #e57585;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        font-size: 14px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      .wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(420px, 100%);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 24px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 6px;
        font-weight: 600;
      }
      p {
        margin: 0 0 18px;
        color: var(--muted);
      }
      .err {
        min-height: 20px;
        color: var(--red);
        font-size: 13px;
        margin: 0 0 12px;
      }
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--text);
        border-radius: 8px;
        padding: 10px 12px;
        margin: 0 0 8px;
      }
      .btn.primary {
        background: var(--text);
        color: var(--bg);
        border-color: var(--text);
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Add Maxwell</h1>
        <p id="copy">
          Sign in with Discord. Only Maxwell admins can add this app —
          to a server or to their own account.
        </p>
        <div id="error" class="err"></div>
        <button id="discordLogin" class="btn primary" type="button">
          Continue with Discord
        </button>
        <button id="addGuild" class="btn primary hidden" type="button">
          Add to a server
        </button>
        <button id="addUser" class="btn hidden" type="button">
          Add to my apps
        </button>
      </div>
    </div>
    <script>
      const DISCORD_AUTH =
        /^https:\/\/(discord\.com|(([a-z0-9-]+\.)?discordapp\.com))\//i;
      const params = new URLSearchParams(location.search);
      const guildId = /^\d{17,20}$/.test(params.get("guild_id") || "")
        ? params.get("guild_id")
        : "";
      const $ = (id) => document.getElementById(id);
      const errorEl = $("error");
      const copyEl = $("copy");
      let token = "";

      function showError(msg) {
        errorEl.textContent = msg || "";
      }
      function headers() {
        return token ? { "X-Discord-Token": token } : {};
      }
      function safeDiscordUrl(url) {
        return typeof url === "string" && DISCORD_AUTH.test(url) ? url : "";
      }
      async function startLogin() {
        const q = new URLSearchParams({ next: "/install/" });
        if (guildId) q.set("guild_id", guildId);
        const r = await fetch("/api/auth/discord/state?" + q.toString());
        const d = await r.json().catch(() => ({}));
        const url = safeDiscordUrl(d.authorize_url);
        if (!r.ok || !url)
          throw new Error(d.error || "Discord login not configured");
        window.location = url;
      }
      async function authorize(context) {
        const q = new URLSearchParams({ context: context || "guild" });
        if (context !== "user" && guildId) q.set("guild_id", guildId);
        const r = await fetch("/api/install/authorize?" + q.toString(), {
          headers: headers(),
        });
        const d = await r.json().catch(() => ({}));
        if (r.status === 401 || r.status === 403) {
          throw new Error("Only Maxwell admins can add this app");
        }
        const url = safeDiscordUrl(d.authorize_url);
        if (!r.ok || !url) throw new Error(d.error || "Could not start install");
        window.location = url;
      }
      function ready(user) {
        $("discordLogin").classList.add("hidden");
        $("addGuild").classList.remove("hidden");
        $("addUser").classList.remove("hidden");
        const name = (user && user.username) || "admin";
        copyEl.textContent =
          "Signed in as " +
          name +
          ". Add to a server is the normal bot member (no Administrator). Add to my apps is personal /maxwell, plus right-click Ask Maxwell / Summarize — still admin-only.";
      }
      async function verify(t) {
        token = t;
        const r = await fetch("/api/auth/discord/verify", { headers: headers() });
        const d = await r.json().catch(() => ({}));
        if (!r.ok || !d.ok) throw new Error("Discord account not authorized");
        localStorage.setItem("mw_discord_token", t);
        ready(d);
      }
      $("discordLogin").onclick = async () => {
        showError("");
        try {
          await startLogin();
        } catch (e) {
          showError(e.message);
        }
      };
      $("addGuild").onclick = async () => {
        showError("");
        try {
          await authorize("guild");
        } catch (e) {
          showError(e.message);
        }
      };
      $("addUser").onclick = async () => {
        showError("");
        try {
          await authorize("user");
        } catch (e) {
          showError(e.message);
        }
      };
      (async function () {
        const hash = location.hash.slice(1);
        const bits = new URLSearchParams(hash);
        if (bits.get("error") === "unauthorized") {
          history.replaceState(null, "", location.pathname + location.search);
          showError("Only Maxwell admins can add this app");
          return;
        }
        if (bits.get("error")) {
          history.replaceState(null, "", location.pathname + location.search);
          showError("Discord login failed");
          return;
        }
        const fromHash = bits.get("discord_token");
        if (fromHash) {
          history.replaceState(null, "", location.pathname + location.search);
          try {
            await verify(fromHash);
          } catch (e) {
            localStorage.removeItem("mw_discord_token");
            showError(e.message);
          }
          return;
        }
        const saved = localStorage.getItem("mw_discord_token");
        if (!saved) return;
        try {
          await verify(saved);
        } catch (e) {
          localStorage.removeItem("mw_discord_token");
        }
      })();
    </script>
  </body>
</html>
